<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <title>Outfit Jf</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <nav>
                <div class="barra_navegacao">
                    <h1 class="logo">Outfit Jf</h1>
                    <div class="imagens">
                        <img src="assets/icons/icons8-pessoa-do-sexo-masculino-64.png" alt="icone perfil" class="icone perfil">
                        <img src="assets/icons/icons8-sacola-de-compras-64.png" alt="icone carrinho de compras" class="icone carrinho">
                    </div>
                    <ul class="menu_itens">
                        <li>Novidades</li>
                        <li>Masculino</li>
                        <li>Feminino</li>
                    </ul>
                </div>
            </nav>
        </header>
        <main>
            <img src="assets/imagens/hero_section.jpg" alt="hero section" class="hero_imagem">
            <div class="botao_compre">Compre agora</div>
            
            <h2 class="titulo">Explore um novo estilo</h2>
            
            <div class="container_card">
                <div class="card card_1">
                    <img src="assets/imagens/camisa_card1.png" alt="camisa" class="imagem_card">
                    <div>
                        <p>Confira agora!</p>
                    </div>
                </div>
                 <div class="card card_2">
                    <img src="assets/imagens/jeans_card2.png" alt="jeans" class="imagem_card" style="height: 100%;">
                    <div>
                        <p>Confira agora!</p>
                    </div>
                </div>

                <div class="card card_3">
                    <img src="assets/imagens/card3_shorts.png" alt="jeans" class="imagem_card">
                    <div>
                        <p>Confira agora!</p>
                    </div>
                </div>

                <div class="card card_4">
                    <img src="assets/imagens/polo_card4.png" alt="jeans" class="imagem_card">
                    <div>
                        <p>Confira agora!</p>
                    </div>
            </div>
        </main>
    </body>
</html>
